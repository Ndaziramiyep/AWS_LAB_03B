AWSTemplateFormatVersion: "2010-09-09"                     # CloudFormation template format version
Description: >-                                             # Shown in the CloudFormation console
  Onward Logistics - 06 delivery. ECR push (tag latest) -> EventBridge -> CodePipeline ->
  CodeDeploy blue/green on ECS with canary traffic shifting and alarm-based auto rollback.
  All roles use customer-managed or AWS-managed policies only.

Parameters:                                                 # Inputs
  ResourcePrefix:                                           # Company naming prefix
    Type: String                                            # Text
    Default: onward-orders-lab                              # <project>-<environment>
    AllowedPattern: "^[a-z][a-z0-9-]{2,24}$"                # Lowercase, short, DNS-safe
    Description: Naming prefix <project>-<environment> applied to every resource.
  ConnectionArn:                                            # GitHub connection
    Type: String                                            # Text (no default - set in deployment file)
    Description: CodeConnections GitHub connection (output of the 00 bootstrap stack).
  GitHubOrg:                                                # Repo owner
    Type: String                                            # Text
    Default: Ndaziramiyep                                   # GitHub account
  AppRepo:                                                  # App repo name
    Type: String                                            # Text
    Default: onward-orders-app                              # Holds appspec.yaml + taskdef.json
  AppBranch:                                                # Branch to read specs from
    Type: String                                            # Text
    Default: main                                           # Released branch
  WatchedImageTag:                                          # Tag that triggers a release
    Type: String                                            # Text
    Default: latest                                         # CI moves "latest" on every merge
    Description: Tag the ECR source action and EventBridge rule react to.
  DeploymentConfigName:                                     # How traffic is shifted
    Type: String                                            # Text
    Default: CodeDeployDefault.ECSCanary10Percent5Minutes   # 10% for 5 min, then 100%
    AllowedValues:                                          # Choices
      - CodeDeployDefault.ECSCanary10Percent5Minutes        # Canary (default)
      - CodeDeployDefault.ECSCanary10Percent15Minutes       # Longer canary
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes   # 10% steps each minute
      - CodeDeployDefault.ECSLinear10PercentEvery3Minutes   # 10% steps every 3 minutes
      - CodeDeployDefault.ECSAllAtOnce                      # Emergency only
    Description: >-
      Canary 10% for 5 minutes exposes a bad release to a small slice of real traffic while the
      alarms watch, then shifts the rest at once. AllAtOnce is only for emergency fixes.
  BlueTerminationWaitMinutes:                               # Rollback window
    Type: Number                                            # Minutes
    Default: 5                                              # Old tasks kept 5 min after success
    MinValue: 0                                             # Lower bound
    MaxValue: 2880                                          # 2 days max (CodeDeploy limit)
    Description: Rollback window - the old (blue) tasks stay running this long after success.
  Target5xxThreshold:                                       # Error budget per minute
    Type: Number                                            # Count
    Default: 5                                              # 5 errors/min stops the release
    Description: Target 5XX responses per minute that stop and roll back a deployment.

Resources:                                                  # Everything this stack creates
  ArtifactBucket:                                           # Stores pipeline artifacts between stages
    Type: AWS::S3::Bucket                                   # S3 bucket
    Properties:                                             # Bucket settings
      BucketName: !Sub ${ResourcePrefix}-artifacts-${AWS::AccountId}-${AWS::Region}  # Globally unique name
      BucketEncryption:                                     # Encryption at rest
        ServerSideEncryptionConfiguration:                  # Default encryption rule
          - ServerSideEncryptionByDefault:                  # Applied to every object
              SSEAlgorithm: AES256                          # S3-managed keys
            BucketKeyEnabled: true                          # Fewer encryption calls
      VersioningConfiguration:                              # Object versions
        Status: Enabled                                     # Keep history (required by CodePipeline)
      PublicAccessBlockConfiguration:                       # Never public
        BlockPublicAcls: true                               # Block public ACLs
        BlockPublicPolicy: true                             # Block public bucket policies
        IgnorePublicAcls: true                              # Ignore any public ACLs
        RestrictPublicBuckets: true                         # Restrict public access
      OwnershipControls:                                    # Object ownership
        Rules:                                              # Rules
          - ObjectOwnership: BucketOwnerEnforced            # ACLs disabled
      LifecycleConfiguration:                               # Automatic clean-up
        Rules:                                              # Rules
          - Id: expire-old-artifacts                        # Rule name
            Status: Enabled                                 # Active
            ExpirationInDays: 30                            # Delete artifacts after 30 days
            NoncurrentVersionExpiration:                    # Old versions
              NoncurrentDays: 7                             # Delete after 7 days
            AbortIncompleteMultipartUpload:                 # Broken uploads
              DaysAfterInitiation: 1                        # Clean up after 1 day
      Tags:                                                 # Resource tags
        - { Key: Name, Value: !Sub "${ResourcePrefix}-artifacts" }  # Name tag

  ArtifactBucketPolicy:                                     # Bucket resource policy
    Type: AWS::S3::BucketPolicy                             # Bucket policy (resource policy, not IAM inline)
    Properties:                                             # Settings
      Bucket: !Ref ArtifactBucket                           # Applies to the artifact bucket
      PolicyDocument:                                       # The policy
        Version: "2012-10-17"                               # Policy language version
        Statement:                                          # Statements
          - Sid: DenyInsecureTransport                      # HTTPS only
            Effect: Deny                                    # Deny
            Principal: "*"                                  # Everyone
            Action: s3:*                                    # Any S3 action
            Resource:                                       # Bucket and objects
              - !GetAtt ArtifactBucket.Arn                  # Bucket
              - !Sub ${ArtifactBucket.Arn}/*                # Objects
            Condition:                                      # When
              Bool:                                         # Boolean check
                aws:SecureTransport: "false"                # Request is not HTTPS

  Target5xxAlarm:                                           # App errors -> roll back
    Type: AWS::CloudWatch::Alarm                            # CloudWatch alarm
    Properties:                                             # Alarm settings
      AlarmName: !Sub ${ResourcePrefix}-alb-target-5xx      # Alarm name
      AlarmDescription: Application returning 5XX errors - stops and rolls back a CodeDeploy deployment.
      Namespace: AWS/ApplicationELB                         # ALB metrics
      MetricName: HTTPCode_Target_5XX_Count                 # 5XX from the app
      Dimensions:                                           # Which ALB
        - Name: LoadBalancer                                # Dimension name
          Value: !ImportValue { "Fn::Sub": "${ResourcePrefix}-alb-full-name" }  # Our ALB
      Statistic: Sum                                        # Total errors
      Period: 60                                            # Per minute
      EvaluationPeriods: 1                                  # One bad minute is enough
      Threshold: !Ref Target5xxThreshold                    # Error budget
      ComparisonOperator: GreaterThanOrEqualToThreshold     # >= threshold
      TreatMissingData: notBreaching                        # No traffic = OK

  BlueUnhealthyHostsAlarm:                                  # Unhealthy tasks in blue group
    Type: AWS::CloudWatch::Alarm                            # CloudWatch alarm
    Properties:                                             # Alarm settings
      AlarmName: !Sub ${ResourcePrefix}-tg-blue-unhealthy   # Alarm name
      AlarmDescription: Unhealthy tasks in the blue target group.
      Namespace: AWS/ApplicationELB                         # ALB metrics
      MetricName: UnHealthyHostCount                        # Failing health checks
      Dimensions:                                           # Which group
        - Name: LoadBalancer                                # ALB dimension
          Value: !ImportValue { "Fn::Sub": "${ResourcePrefix}-alb-full-name" }  # Our ALB
        - Name: TargetGroup                                 # Target group dimension
          Value: !ImportValue { "Fn::Sub": "${ResourcePrefix}-tg-blue-full-name" }  # Blue group
      Statistic: Maximum                                    # Worst value in the period
      Period: 60                                            # Per minute
      EvaluationPeriods: 2                                  # Look at 2 minutes
      DatapointsToAlarm: 2                                  # Both must breach (avoids blips)
      Threshold: 1                                          # Any unhealthy task
      ComparisonOperator: GreaterThanOrEqualToThreshold     # >= 1
      TreatMissingData: notBreaching                        # Empty group = OK

  GreenUnhealthyHostsAlarm:                                 # Unhealthy tasks in green group (groups swap each release)
    Type: AWS::CloudWatch::Alarm                            # CloudWatch alarm
    Properties:                                             # Alarm settings
      AlarmName: !Sub ${ResourcePrefix}-tg-green-unhealthy  # Alarm name
      AlarmDescription: Unhealthy tasks in the green target group.
      Namespace: AWS/ApplicationELB                         # ALB metrics
      MetricName: UnHealthyHostCount                        # Failing health checks
      Dimensions:                                           # Which group
        - Name: LoadBalancer                                # ALB dimension
          Value: !ImportValue { "Fn::Sub": "${ResourcePrefix}-alb-full-name" }  # Our ALB
        - Name: TargetGroup                                 # Target group dimension
          Value: !ImportValue { "Fn::Sub": "${ResourcePrefix}-tg-green-full-name" }  # Green group
      Statistic: Maximum                                    # Worst value in the period
      Period: 60                                            # Per minute
      EvaluationPeriods: 2                                  # Look at 2 minutes
      DatapointsToAlarm: 2                                  # Both must breach
      Threshold: 1                                          # Any unhealthy task
      ComparisonOperator: GreaterThanOrEqualToThreshold     # >= 1
      TreatMissingData: notBreaching                        # Empty group = OK

  CodeDeployServiceRole:                                    # Role CodeDeploy uses to shift traffic
    Type: AWS::IAM::Role                                    # IAM role
    Properties:                                             # Role settings
      RoleName: !Sub ${ResourcePrefix}-codedeploy-role      # Role name
      Description: CodeDeploy blue/green for ECS.
      AssumeRolePolicyDocument:                             # Trust policy
        Version: "2012-10-17"                               # Policy language version
        Statement:                                          # Statements
          - Effect: Allow                                   # Allow assume
            Principal: { Service: codedeploy.amazonaws.com }  # CodeDeploy
            Action: sts:AssumeRole                          # Assume the role
            Condition:                                      # Confused-deputy protection
              StringEquals:                                 # Exact match
                aws:SourceAccount: !Ref AWS::AccountId      # This account only
      ManagedPolicyArns:                                    # Managed policies only
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS  # AWS-managed ECS blue/green policy
      Tags:                                                 # Resource tags
        - { Key: Name, Value: !Sub "${ResourcePrefix}-codedeploy-role" }  # Name tag

  CodeDeployApplication:                                    # CodeDeploy application container
    Type: AWS::CodeDeploy::Application                      # Application resource
    Properties:                                             # Settings
      ApplicationName: !Sub ${ResourcePrefix}-app           # Application name
      ComputePlatform: ECS                                  # ECS deployments
      Tags:                                                 # Resource tags
        - { Key: Name, Value: !Sub "${ResourcePrefix}-app" }  # Name tag

  DeploymentGroup:                                          # How and where releases happen
    Type: AWS::CodeDeploy::DeploymentGroup                  # Deployment group resource
    Properties:                                             # Settings
      ApplicationName: !Ref CodeDeployApplication           # Parent application
      DeploymentGroupName: !Sub ${ResourcePrefix}-dg        # Group name
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn     # Role above
      DeploymentConfigName: !Ref DeploymentConfigName       # Canary / linear choice
      DeploymentStyle:                                      # Style
        DeploymentType: BLUE_GREEN                          # New task set beside the old one
        DeploymentOption: WITH_TRAFFIC_CONTROL              # Shift ALB traffic
      BlueGreenDeploymentConfiguration:                     # Blue/green settings
        DeploymentReadyOption:                              # When to start shifting
          ActionOnTimeout: CONTINUE_DEPLOYMENT              # No manual approval (merge is the only manual step)
          WaitTimeInMinutes: 0                              # Start immediately
        TerminateBlueInstancesOnDeploymentSuccess:          # Old version clean-up
          Action: TERMINATE                                 # Stop old tasks
          TerminationWaitTimeInMinutes: !Ref BlueTerminationWaitMinutes  # After the rollback window
      ECSServices:                                          # Target service
        - ClusterName: !ImportValue { "Fn::Sub": "${ResourcePrefix}-cluster-name" }  # Cluster
          ServiceName: !ImportValue { "Fn::Sub": "${ResourcePrefix}-service-name" }  # Service
      LoadBalancerInfo:                                     # ALB wiring
        TargetGroupPairInfoList:                            # Blue/green pair
          - TargetGroups:                                   # The two groups
              - Name: !ImportValue { "Fn::Sub": "${ResourcePrefix}-tg-blue-name" }   # Blue
              - Name: !ImportValue { "Fn::Sub": "${ResourcePrefix}-tg-green-name" }  # Green
            ProdTrafficRoute:                               # Customer traffic
              ListenerArns:                                 # Listener list
                - !ImportValue { "Fn::Sub": "${ResourcePrefix}-prod-listener-arn" }  # Production listener
            TestTrafficRoute:                               # Preview traffic
              ListenerArns:                                 # Listener list
                - !ImportValue { "Fn::Sub": "${ResourcePrefix}-test-listener-arn" }  # Test listener
      AutoRollbackConfiguration:                            # Automatic rollback
        Enabled: true                                       # On
        Events:                                             # Triggers
          - DEPLOYMENT_FAILURE                              # Deployment fails
          - DEPLOYMENT_STOP_ON_ALARM                        # An alarm fires
          - DEPLOYMENT_STOP_ON_REQUEST                      # Someone presses Stop
      AlarmConfiguration:                                   # Alarms watched during release
        Enabled: true                                       # On
        IgnorePollAlarmFailure: false                       # Fail safe if alarms can't be read
        Alarms:                                             # The alarms
          - Name: !Ref Target5xxAlarm                       # App errors
          - Name: !Ref BlueUnhealthyHostsAlarm              # Blue health
          - Name: !Ref GreenUnhealthyHostsAlarm             # Green health
      Tags:                                                 # Resource tags
        - { Key: Name, Value: !Sub "${ResourcePrefix}-dg" } # Name tag

  PipelinePolicy:                                           # Least privilege for the pipeline
    Type: AWS::IAM::ManagedPolicy                           # Customer-managed, never inline
    Properties:                                             # Policy settings
      ManagedPolicyName: !Sub ${ResourcePrefix}-pipeline-policy  # Policy name
      Description: Least privilege for the Onward Orders release pipeline.
      PolicyDocument:                                       # The permissions
        Version: "2012-10-17"                               # Policy language version
        Statement:                                          # Statements
          - Sid: ArtifactBucket                             # Read/write artifacts
            Effect: Allow                                   # Grant
            Action:                                         # S3 actions
              - s3:GetObject                                # Read artifacts
              - s3:GetObjectVersion                         # Read artifact versions
              - s3:PutObject                                # Write artifacts
              - s3:GetBucketVersioning                      # Check versioning
              - s3:GetBucketLocation                        # Find bucket region
            Resource:                                       # Artifact bucket only
              - !GetAtt ArtifactBucket.Arn                  # Bucket
              - !Sub ${ArtifactBucket.Arn}/*                # Objects
          - Sid: EcrSource                                  # Read the new image details
            Effect: Allow                                   # Grant
            Action: ecr:DescribeImages                      # Image digest lookup
            Resource: !ImportValue { "Fn::Sub": "${ResourcePrefix}-ecr-repo-arn" }  # Our repo only
          - Sid: GitHubSource                               # Read appspec/taskdef from GitHub
            Effect: Allow                                   # Grant
            Action:                                         # Connection actions
              - codeconnections:UseConnection               # New namespace
              - codestar-connections:UseConnection          # Legacy namespace
            Resource: !Ref ConnectionArn                    # This connection only
          - Sid: CodeDeploy                                 # Start blue/green deployments
            Effect: Allow                                   # Grant
            Action:                                         # CodeDeploy actions
              - codedeploy:CreateDeployment                 # Start a release
              - codedeploy:GetDeployment                    # Track it
              - codedeploy:GetApplication                   # Read app
              - codedeploy:GetApplicationRevision           # Read revision
              - codedeploy:RegisterApplicationRevision      # Register revision
              - codedeploy:GetDeploymentConfig              # Read canary config
            Resource:                                       # Our app/group + configs
              - !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}  # App
              - !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/*  # Group
              - !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*  # Configs
          - Sid: RegisterTaskDefinition                     # New task definition revision per release
            Effect: Allow                                   # Grant
            Action:                                         # ECS actions
              - ecs:RegisterTaskDefinition                  # Register from taskdef.json
              - ecs:DescribeTaskDefinition                  # Read it back
              - ecs:DescribeServices                        # Read service state
            Resource: "*"                                   # These actions have no resource-level control
          - Sid: PassOnlyTaskRolesToEcs                     # Allow handing the task roles to ECS
            Effect: Allow                                   # Grant
            Action: iam:PassRole                            # Pass role
            Resource:                                       # Only these two roles
              - !ImportValue { "Fn::Sub": "${ResourcePrefix}-task-exec-role-arn" }  # Exec role
              - !ImportValue { "Fn::Sub": "${ResourcePrefix}-task-role-arn" }       # Task role
            Condition:                                      # Only to ECS tasks
              StringEquals:                                 # Exact match
                iam:PassedToService: ecs-tasks.amazonaws.com  # ECS tasks service

  PipelineRole:                                             # Role CodePipeline runs as
    Type: AWS::IAM::Role                                    # IAM role
    Properties:                                             # Role settings
      RoleName: !Sub ${ResourcePrefix}-pipeline-role        # Role name
      Description: CodePipeline service role for the Onward Orders release pipeline.
      AssumeRolePolicyDocument:                             # Trust policy
        Version: "2012-10-17"                               # Policy language version
        Statement:                                          # Statements
          - Effect: Allow                                   # Allow assume
            Principal: { Service: codepipeline.amazonaws.com }  # CodePipeline
            Action: sts:AssumeRole                          # Assume the role
            Condition:                                      # Confused-deputy protection
              StringEquals:                                 # Exact match
                aws:SourceAccount: !Ref AWS::AccountId      # This account only
      ManagedPolicyArns:                                    # Managed policies only
        - !Ref PipelinePolicy                               # Policy above
      Tags:                                                 # Resource tags
        - { Key: Name, Value: !Sub "${ResourcePrefix}-pipeline-role" }  # Name tag

  Pipeline:                                                 # The release pipeline
    Type: AWS::CodePipeline::Pipeline                       # Pipeline resource
    Properties:                                             # Pipeline settings
      Name: !Sub ${ResourcePrefix}-pipeline                 # Pipeline name
      PipelineType: V2                                      # Current pipeline type
      ExecutionMode: QUEUED                                 # Each pushed image released in order
      RoleArn: !GetAtt PipelineRole.Arn                     # Role above
      ArtifactStore:                                        # Where artifacts go
        Type: S3                                            # S3
        Location: !Ref ArtifactBucket                       # Artifact bucket
      Stages:                                               # Pipeline stages
        - Name: Source                                      # Stage 1: gather inputs
          Actions:                                          # Two parallel sources
            - Name: Image                                   # The new container image
              ActionTypeId: { Category: Source, Owner: AWS, Provider: ECR, Version: "1" }  # ECR source
              Configuration:                                # Settings
                RepositoryName: !ImportValue { "Fn::Sub": "${ResourcePrefix}-ecr-repo-name" }  # Our repo
                ImageTag: !Ref WatchedImageTag              # latest
              OutputArtifacts:                              # Output
                - Name: ImageArtifact                       # imageDetail.json with the image URI
              RunOrder: 1                                   # Runs in parallel with DeploySpecs
            - Name: DeploySpecs                             # appspec.yaml + taskdef.json
              ActionTypeId: { Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: "1" }  # GitHub source
              Configuration:                                # Settings
                ConnectionArn: !Ref ConnectionArn           # GitHub connection
                FullRepositoryId: !Sub ${GitHubOrg}/${AppRepo}  # owner/repo
                BranchName: !Ref AppBranch                  # main
                DetectChanges: false                        # Commits alone don't start a release (image push does)
                OutputArtifactFormat: CODE_ZIP              # Zip of the repo
              OutputArtifacts:                              # Output
                - Name: SourceArtifact                      # Repo files
              RunOrder: 1                                   # Runs in parallel with Image
        - Name: Deploy                                      # Stage 2: release
          Actions:                                          # One action
            - Name: BlueGreenToEcs                          # CodeDeploy blue/green
              ActionTypeId: { Category: Deploy, Owner: AWS, Provider: CodeDeployToECS, Version: "1" }  # ECS blue/green provider
              Configuration:                                # Settings
                ApplicationName: !Ref CodeDeployApplication # CodeDeploy app
                DeploymentGroupName: !Ref DeploymentGroup   # CodeDeploy group
                TaskDefinitionTemplateArtifact: SourceArtifact  # Artifact holding taskdef
                TaskDefinitionTemplatePath: taskdef.json    # Task definition template (JSON)
                AppSpecTemplateArtifact: SourceArtifact     # Artifact holding appspec
                AppSpecTemplatePath: appspec.yaml           # AppSpec file
                Image1ArtifactName: ImageArtifact           # Artifact with the image URI
                Image1ContainerName: IMAGE1_NAME            # Placeholder replaced in taskdef.json
              InputArtifacts:                               # Inputs
                - Name: SourceArtifact                      # Specs
                - Name: ImageArtifact                       # Image
              RunOrder: 1                                   # First action
      Tags:                                                 # Resource tags
        - { Key: Name, Value: !Sub "${ResourcePrefix}-pipeline" }  # Name tag

  EventsInvokePipelinePolicy:                               # EventBridge may start this pipeline only
    Type: AWS::IAM::ManagedPolicy                           # Customer-managed, never inline
    Properties:                                             # Policy settings
      ManagedPolicyName: !Sub ${ResourcePrefix}-events-start-pipeline-policy  # Policy name
      Description: Lets EventBridge start the release pipeline and nothing else.
      PolicyDocument:                                       # The permissions
        Version: "2012-10-17"                               # Policy language version
        Statement:                                          # Statements
          - Effect: Allow                                   # Grant
            Action: codepipeline:StartPipelineExecution     # Start a run
            Resource: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}  # This pipeline only

  EventsInvokePipelineRole:                                 # Role EventBridge uses
    Type: AWS::IAM::Role                                    # IAM role
    Properties:                                             # Role settings
      RoleName: !Sub ${ResourcePrefix}-events-pipeline-role # Role name
      Description: EventBridge target role for the ECR push rule.
      AssumeRolePolicyDocument:                             # Trust policy
        Version: "2012-10-17"                               # Policy language version
        Statement:                                          # Statements
          - Effect: Allow                                   # Allow assume
            Principal: { Service: events.amazonaws.com }    # EventBridge
            Action: sts:AssumeRole                          # Assume the role
            Condition:                                      # Confused-deputy protection
              StringEquals:                                 # Exact match
                aws:SourceAccount: !Ref AWS::AccountId      # This account only
      ManagedPolicyArns:                                    # Managed policies only
        - !Ref EventsInvokePipelinePolicy                   # Policy above
      Tags:                                                 # Resource tags
        - { Key: Name, Value: !Sub "${ResourcePrefix}-events-pipeline-role" }  # Name tag

  EcrPushRule:                                              # ECR push event -> start pipeline (no polling)
    Type: AWS::Events::Rule                                 # EventBridge rule
    Properties:                                             # Rule settings
      Name: !Sub ${ResourcePrefix}-ecr-push-to-pipeline     # Rule name
      Description: Start the release pipeline when a new image is pushed with the watched tag.
      State: ENABLED                                        # Active
      EventPattern:                                         # Which events match
        source:                                             # Event source
          - aws.ecr                                         # ECR
        detail-type:                                        # Event type
          - ECR Image Action                                # Image push/delete events
        detail:                                             # Event details
          action-type:                                      # Action
            - PUSH                                          # Pushes only
          result:                                           # Outcome
            - SUCCESS                                       # Successful only
          repository-name:                                  # Repo
            - !ImportValue { "Fn::Sub": "${ResourcePrefix}-ecr-repo-name" }  # Our repo
          image-tag:                                        # Tag
            - !Ref WatchedImageTag                          # latest
      Targets:                                              # What to trigger
        - Id: StartPipeline                                 # Target ID
          Arn: !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}  # The pipeline
          RoleArn: !GetAtt EventsInvokePipelineRole.Arn     # Role used to start it

Outputs:                                                    # Values for reference
  PipelineName:                                             # Pipeline name
    Value: !Ref Pipeline                                    # Value
  CodeDeployApplicationName:                                # CodeDeploy app
    Value: !Ref CodeDeployApplication                       # Value
  DeploymentGroupName:                                      # CodeDeploy group
    Value: !Ref DeploymentGroup                             # Value
  ArtifactBucketName:                                       # Artifact bucket
    Value: !Ref ArtifactBucket                              # Value
